[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "excel-matcher"
version = "0.1.0"
description = "Local Excel intelligent business matching MVP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "openpyxl>=3.1.5",
  "pandas>=2.2.0",
  "pydantic>=2.8.0",
  "python-multipart>=0.0.9",
  "rapidfuzz>=3.9.0",
  "streamlit>=1.36.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
semantic = [
  "faiss-cpu>=1.8.0",
  "sentence-transformers>=3.0.0",
]
test = ["pytest>=8.2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
